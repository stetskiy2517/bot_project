name: fix-undo-browser-test

on:
  push:
    branches: [release/p2-p8-current]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix undo browser synchronization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/browser_features.py')
          text = path.read_text()
          old = '''        button.click()\n        expect(button).to_be_disabled()\n        assert not list_notes(user)\n'''
          new = '''        button.click()\n        page.wait_for_function("document.getElementById('undoNoteAction').textContent === 'Нет действия для отмены'")\n        expect(button).to_be_disabled()\n        assert not list_notes(user)\n'''
          if old not in text:
              print('browser undo synchronization already fixed')
              raise SystemExit(0)
          path.write_text(text.replace(old, new, 1))
          PY
          if git diff --quiet; then exit 0; fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser_features.py
          git commit -m "test: wait for completed undo response in browser audit"
          git push origin HEAD:release/p2-p8-current
