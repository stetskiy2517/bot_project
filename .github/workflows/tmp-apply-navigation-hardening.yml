name: temporary-apply-navigation-hardening

on:
  push:
    branches:
      - codex/navigation-user-behavior-hardening

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/navigation-user-behavior-hardening
          fetch-depth: 0

      - name: Apply parser and navigation hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise RuntimeError(f"marker not found: {label}")
              return text.replace(old, new, 1)

          router_path = Path("modules/router.py")
          router = router_path.read_text(encoding="utf-8")

          event_start = router.index("EVENT_WORDS = (")
          action_start = router.index("ACTION_WORDS = (", event_start)
          router = router[:event_start] + '''EVENT_WORDS = (
              "встреч", "созвон", "звонок", "врач", "невролог", "стоматолог", "мрт", "узи",
              "трениров", "зал", "кино", "ресторан", "рейс", "полет", "полёт", "поезд", "такси", "совещ",
              "планерк", "клиент", "переговор", "день рождения", "обед", "ужин", "завтрак",
              "отпуск", "командиров", "прогул", "прагул", "погуля", "прогуля", "пробеж", "кафе", "театр", "концерт",
              "выстав", "музей", "бассейн", "футбол", "матч", "кофе", "массаж", "парикмах",
              "барбер", "маникюр", "стриж", "занят", "урок", "лекци", "экзамен", "прием", "приём", "йог", "пилатес", "тренеров",
          )
          BARE_CREATE_EVENT_WORDS = (
              "встреч", "созвон", "звонок", "врач", "невролог", "стоматолог", "мрт", "узи",
              "трениров", "кино", "совещ", "планерк", "переговор", "день рождения", "обед", "ужин",
              "завтрак", "отпуск", "командиров", "прогул", "прагул", "погуля", "прогуля", "пробеж", "поездк", "театр", "концерт",
              "выстав", "музей", "бассейн", "футбол", "матч", "массаж", "парикмах", "барбер",
              "маникюр", "стриж", "занят", "урок", "лекци", "экзамен", "прием", "приём", "йог", "пилатес", "тренеров",
          )
          ''' + router[action_start:]

          router = replace_once(
              router,
              'INFO_CREATE_QUESTION_RE = re.compile(',
              '''BARE_EVENT_STATEMENT_RE = re.compile(
              r"\\b(?:люблю|нравит\\w*|полезн\\w*|обычн\\w*|часто|редко|был\\w*|была|были|прошл\\w*|"
              r"прошел|прошёл|прошла|закончил\\w*|состоял\\w*|тяжел\\w*|тяжёл\\w*)\\b",
              re.IGNORECASE,
          )
          INFO_CREATE_QUESTION_RE = re.compile(''',
              "bare statement guard",
          )
          router = replace_once(
              router,
              'CURRENT_STATE_RE = re.compile(',
              '''LEADING_BARE_HOUR_RE = re.compile(
              r"^\\s*(?P<hour>[01]?\\d|2[0-3])\\s+(?P<body>\\D.+)$",
              re.IGNORECASE,
          )
          CURRENT_STATE_RE = re.compile(''',
              "leading bare hour",
          )

          creation_start = router.index("def _creation_text(text: str) -> str:")
          helper_marker = "def _creation_text(text: str) -> str:"
          helpers = '''def _contains_event_marker(text: str) -> bool:
              return any(word in text for word in EVENT_WORDS)
          
          
          def _looks_like_bare_event(text: str) -> bool:
              normal = _normalise(text)
              if BARE_EVENT_STATEMENT_RE.search(normal):
                  return False
              tokens = re.findall(r"[a-zа-я0-9]+", normal)
              if not tokens or len(tokens) > 10:
                  return False
              if any(normal.startswith(word) for word in BARE_CREATE_EVENT_WORDS):
                  return True
              if re.match(r"^(?:после|перед)\\b", normal) and any(word in normal for word in BARE_CREATE_EVENT_WORDS):
                  return True
              return False
          
          
          '''
          router = router[:creation_start] + helpers + router[creation_start:]

          creation_start = router.index("def _creation_text(text: str) -> str:")
          action_start = router.index("def _action_text(text: str) -> str:", creation_start)
          creation_fn = '''def _creation_text(text: str) -> str:
              """Исправить безопасные разговорные/ASR-варианты только для создания события."""
              result = text
              if REMIND_ME_AS_COMMAND_RE.search(result):
                  result = REMIND_ME_AS_COMMAND_RE.sub("напомни", result, count=1)
          
              lower = _normalise(result)
              command_like = (
                  bool(DATE_HINT_RE.search(lower))
                  or any(word in lower for word in CREATE_WORDS)
                  or _contains_event_marker(lower)
                  or _looks_like_bare_event(lower)
              )
              if command_like and _extract_time(lower) is None:
                  match = TRAILING_BARE_HOUR_RE.search(result)
                  if match:
                      hour = match.group("hour")
                      punct = match.group("punct") or ""
                      result = f"{result[:match.start('hour')]}в {hour}{punct}"
                      lower = _normalise(result)
          
              if command_like and _extract_time(lower) is None:
                  leading = LEADING_BARE_HOUR_RE.match(result)
                  if leading:
                      result = f"в {leading.group('hour')} {leading.group('body').strip()}"
              return result
          
          
          '''
          router = router[:creation_start] + creation_fn + router[action_start:]

          router = replace_once(
              router,
              '''    if NON_EVENT_STATEMENT_RE.search(lower):
                  return IntentResult(INTENT_UNKNOWN, 0.0)
          
              has_event = any(word in lower for word in EVENT_WORDS)
          ''',
              '''    if NON_EVENT_STATEMENT_RE.search(lower):
                  return IntentResult(INTENT_UNKNOWN, 0.0)
              if BARE_EVENT_STATEMENT_RE.search(lower):
                  return IntentResult(INTENT_UNKNOWN, 0.0)
          
              has_event = _contains_event_marker(lower)
          ''',
              "detect intent event guard",
          )
          router = replace_once(
              router,
              '''    if has_action and (has_date or has_time) and not is_question and not is_current_state:
                  return IntentResult(INTENT_CREATE, 0.84)
              return IntentResult(INTENT_UNKNOWN, 0.0)
          ''',
              '''    if has_action and (has_date or has_time) and not is_question and not is_current_state:
                  return IntentResult(INTENT_CREATE, 0.84)
              if _looks_like_bare_event(lower) and not is_question and not is_current_state:
                  return IntentResult(INTENT_CREATE, 0.76)
              return IntentResult(INTENT_UNKNOWN, 0.0)
          ''',
              "bare event intent",
          )

          needs_start = router.index("def _needs_time(text: str) -> bool:")
          pending_start = router.index("def _pending(", needs_start)
          router = router[:needs_start] + '''def _needs_time(text: str) -> bool:
              if is_all_day(text):
                  return False
              lower = _normalise(text)
              if _extract_time(lower) is not None or _relative_offset(lower) is not None:
                  return False
              return bool(
                  DATE_HINT_RE.search(lower)
                  or any(word in lower for word in CREATE_WORDS)
                  or _looks_like_bare_event(lower)
              )
          
          
          ''' + router[pending_start:]

          router = replace_once(
              router,
              '    combined = f"{pending[\'text\']} {reply}"\n',
              '    combined = _creation_text(f"{pending[\'text\']} {reply}")\n',
              "pending time repair",
          )
          router = replace_once(
              router,
              '        await update.message.reply_text("Не понял время. Напиши, например: 19:00, 19 или в 7 вечера.")',
              '        await update.message.reply_text("Не понял время. Напиши, например: 19:00, 19 или «завтра в 19».")',
              "pending time help",
          )
          router = replace_once(
              router,
              '    return any(marker in lower for marker in calendar_markers)\n',
              '    return any(marker in lower for marker in calendar_markers) or _looks_like_bare_event(lower)\n',
              "note calendar guard",
          )
          router = replace_once(
              router,
              '''        if _needs_time(create_text):
                  context.user_data["smart_planner_pending"] = {"type": "create_time", "text": create_text}
                  await update.message.reply_text("Во сколько поставить событие?")
                  return True
          ''',
              '''        if _needs_time(create_text):
                  context.user_data["smart_planner_pending"] = {"type": "create_time", "text": create_text}
                  if DATE_HINT_RE.search(_normalise(create_text)):
                      prompt = "Во сколько поставить событие?"
                  else:
                      prompt = "Когда поставить событие? Напиши, например: «22:00» или «завтра в 19»."
                  await update.message.reply_text(prompt)
                  return True
          ''',
              "natural create prompt",
          )
          router_path.write_text(router, encoding="utf-8")

          nav_path = Path("modules/navigation.py")
          nav = nav_path.read_text(encoding="utf-8")
          nav = replace_once(
              nav,
              'TEMPORAL_DESTINATION_RE = re.compile(',
              '''WALK_THROUGH_DESTINATION_RE = re.compile(
              r"^\\s*(?:прогул\\w*|прагул\\w*|погуля\\w*|прогуля\\w*|пробеж\\w*)\\s+по\\s+(?P<location>.+?)\\s*$",
              re.IGNORECASE,
          )
          BARE_ACTIVITY_DESTINATION_RE = re.compile(
              r"^\\s*(?:"
              r"прогул\\w*|прагул\\w*|погуля\\w*|прогуля\\w*|пробеж\\w*|"
              r"трениров\\w*|тренеров\\w*|поездк\\w*|поех\\w*"
              r")\\s+(?P<location>.+?)\\s*$",
              re.IGNORECASE,
          )
          TEMPORAL_DESTINATION_RE = re.compile(''',
              "natural navigation regexes",
          )
          nav = replace_once(
              nav,
              'HOME_PLACE_RE = re.compile(',
              '''NON_LOCATION_TAIL_RE = re.compile(
              r"^(?:с|со|у|для|к|от|до|через|после|перед|вместе\\s+с)\\b",
              re.IGNORECASE,
          )
          HOME_PLACE_RE = re.compile(''',
              "non-location tail guard",
          )
          clean_start = nav.index("def _clean_destination_candidate(")
          event_dest_start = nav.index("def _event_destination(", clean_start)
          nav = nav[:clean_start] + '''def _clean_destination_candidate(value: str, *, bare_activity: bool = False) -> str | None:
              candidate = re.sub(r"\\s+", " ", value).strip(" ,.;")
              candidate = re.split(
                  r"\\s+(?:после|перед)\\s+",
                  candidate,
                  maxsplit=1,
                  flags=re.IGNORECASE,
              )[0].strip(" ,.;")
              if not candidate:
                  return None
              normalized = _normalise_place_text(candidate)
              if TEMPORAL_DESTINATION_RE.fullmatch(normalized):
                  return None
              if bare_activity and NON_LOCATION_TAIL_RE.match(normalized):
                  return None
              return candidate[:500]
          
          
          def _summary_destination(summary: str) -> str | None:
              match = NATURAL_DESTINATION_RE.search(summary)
              if match:
                  return _clean_destination_candidate(match.group("location"))
          
              match = PREPOSITIONAL_DESTINATION_RE.search(summary)
              if match:
                  return _clean_destination_candidate(match.group("location"))
          
              match = WALK_THROUGH_DESTINATION_RE.match(summary)
              if match:
                  return _clean_destination_candidate(match.group("location"), bare_activity=True)
          
              match = BARE_ACTIVITY_DESTINATION_RE.match(summary)
              if not match:
                  return None
              return _clean_destination_candidate(match.group("location"), bare_activity=True)
          
          
          ''' + nav[event_dest_start:]
          nav_path.write_text(nav, encoding="utf-8")
          PY

          cat > tests/test_navigation_user_behavior.py <<'PYTEST'
          from datetime import datetime
          import unittest
          from unittest.mock import AsyncMock, patch

          from modules.calendar import _extract_title, _parse_event_timing
          from modules.navigation import _resolved_event_destination, _summary_destination
          from modules.router import (
              INTENT_CREATE,
              INTENT_UNKNOWN,
              _creation_text,
              _needs_time,
              _resume_pending,
              detect_intent,
          )


          class NaturalCalendarCommandTests(unittest.TestCase):
              def setUp(self):
                  self.now = datetime(2026, 9, 14, 12, 0)

              def test_common_activity_phrases_with_time_are_create_commands(self):
                  cases = [
                      "прогулка в ботанический сад 22:00",
                      "прогулка ботанический сад 22:00",
                      "прогулка на ВДНХ сегодня в 22",
                      "погулять по ВДНХ завтра в 19",
                      "тренировка Лужники 20:30",
                      "театр завтра в 19:00",
                      "массаж в 18:30",
                      "бассейн завтра в 7",
                      "футбол в субботу в 16",
                      "ужин дома 19:00",
                      "встреча на работе 21:00",
                  ]
                  for text in cases:
                      with self.subTest(text=text):
                          self.assertEqual(detect_intent(text).name, INTENT_CREATE)

              def test_trailing_bare_hour_is_repaired_without_explicit_date(self):
                  cases = {
                      "прогулка ботанический сад 22": "прогулка ботанический сад в 22",
                      "тренировка Лужники 20": "тренировка Лужники в 20",
                      "ужин дома 19": "ужин дома в 19",
                  }
                  for text, expected in cases.items():
                      with self.subTest(text=text):
                          repaired = _creation_text(text)
                          self.assertEqual(repaired, expected)
                          self.assertEqual(detect_intent(text).name, INTENT_CREATE)

              def test_leading_bare_hour_is_repaired_for_event_like_phrase(self):
                  repaired = _creation_text("22 прогулка ботанический сад")
                  self.assertEqual(repaired, "в 22 прогулка ботанический сад")
                  self.assertEqual(detect_intent("22 прогулка ботанический сад").name, INTENT_CREATE)

              def test_bare_activity_without_time_prompts_instead_of_failing(self):
                  cases = [
                      "прогулка ботанический сад",
                      "прогулка на ВДНХ",
                      "погулять по ВДНХ",
                      "встреча с Иваном",
                      "тренировка Лужники",
                      "театр Большой",
                      "массаж",
                  ]
                  for text in cases:
                      with self.subTest(text=text):
                          self.assertEqual(detect_intent(text).name, INTENT_CREATE)
                          self.assertTrue(_needs_time(_creation_text(text)))

              def test_date_without_time_still_prompts(self):
                  for text in ["прогулка на ВДНХ завтра", "тренировка в пятницу", "театр завтра"]:
                      with self.subTest(text=text):
                          self.assertEqual(detect_intent(text).name, INTENT_CREATE)
                          self.assertTrue(_needs_time(text))

              def test_activity_statements_and_questions_are_not_created(self):
                  cases = [
                      "прогулки полезны для здоровья",
                      "я был на прогулке вчера",
                      "тренировка сегодня была тяжелой",
                      "как пройти в ботанический сад",
                      "где прогулка завтра?",
                      "погода в ботаническом саду завтра в 22:00",
                      "новости ВДНХ завтра в 22:00",
                  ]
                  for text in cases:
                      with self.subTest(text=text):
                          self.assertEqual(detect_intent(text).name, INTENT_UNKNOWN)

              def test_parser_keeps_place_in_title_and_uses_time(self):
                  timing = _parse_event_timing("прогулка в ботанический сад 22:00", self.now)
                  self.assertIsNotNone(timing)
                  self.assertEqual(timing[0], datetime(2026, 9, 14, 22, 0))
                  self.assertEqual(_extract_title("прогулка в ботанический сад 22:00"), "Прогулка в ботанический сад")


          class NaturalNavigationDestinationTests(unittest.TestCase):
              def test_prepositional_and_bare_walk_destinations(self):
                  cases = {
                      "Прогулка в ботанический сад": "ботанический сад",
                      "Прогулка на ВДНХ": "ВДНХ",
                      "Прогулка ботанический сад": "ботанический сад",
                      "Погулять ботанический сад": "ботанический сад",
                      "Прогуляться по ВДНХ": "ВДНХ",
                      "Тренировка Лужники": "Лужники",
                      "Поездка Шереметьево": "Шереметьево",
                  }
                  for summary, expected in cases.items():
                      with self.subTest(summary=summary):
                          self.assertEqual(_summary_destination(summary), expected)

              def test_non_location_walk_tails_are_rejected(self):
                  for summary in [
                      "Прогулка с детьми",
                      "Прогулка после работы",
                      "Прогулка перед сном",
                      "Тренировка с тренером",
                  ]:
                      with self.subTest(summary=summary):
                          self.assertIsNone(_summary_destination(summary))

              def test_temporal_phrases_are_not_destinations(self):
                  for summary in ["Прогулка на завтра", "Прогулка в пятницу", "Прогулка в 21:00"]:
                      with self.subTest(summary=summary):
                          self.assertIsNone(_summary_destination(summary))

              def test_home_and_office_aliases_remain_supported(self):
                  prefs = {
                      "home_address": "Москва, проспект Мира, 1",
                      "office_address": "Москва, Гиляровского, 53",
                  }
                  self.assertEqual(
                      _resolved_event_destination({"summary": "Ужин дома"}, prefs),
                      "Москва, проспект Мира, 1",
                  )
                  self.assertEqual(
                      _resolved_event_destination({"summary": "Встреча на работе"}, prefs),
                      "Москва, Гиляровского, 53",
                  )


          class PendingNaturalEventTimeTests(unittest.IsolatedAsyncioTestCase):
              class Context:
                  def __init__(self):
                      self.user_data = {
                          "smart_planner_pending": {
                              "type": "create_time",
                              "text": "прогулка ботанический сад",
                          }
                      }

              class Message:
                  def __init__(self):
                      self.replies = []

                  async def reply_text(self, text):
                      self.replies.append(text)

              class User:
                  id = 1

              class Update:
                  def __init__(self):
                      self.message = PendingNaturalEventTimeTests.Message()
                      self.effective_user = PendingNaturalEventTimeTests.User()

              async def test_pending_event_accepts_tomorrow_plus_bare_hour(self):
                  context = self.Context()
                  update = self.Update()
                  with patch("modules.router.create_from_text", new=AsyncMock(return_value=True)) as create:
                      handled = await _resume_pending(update, context, "завтра 22")
                  self.assertTrue(handled)
                  create.assert_awaited_once()
                  combined = create.await_args.args[2]
                  self.assertEqual(combined, "прогулка ботанический сад завтра в 22")
                  self.assertNotIn("smart_planner_pending", context.user_data)


          if __name__ == "__main__":
              unittest.main()
          PYTEST

          rm -rf .tmp
          python -m py_compile modules/router.py modules/navigation.py tests/test_navigation_user_behavior.py
          git diff --check

      - name: Commit hardened implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/router.py modules/navigation.py tests/test_navigation_user_behavior.py
          git rm .github/workflows/tmp-apply-navigation-hardening.yml
          git add -A .tmp || true
          git commit -m "Harden natural calendar and navigation commands"
          git push origin HEAD:codex/navigation-user-behavior-hardening
