name: repair-dasha-smart-categories

on:
  push:
    branches:
      - ops/dasha-event-20260922
    paths:
      - .github/workflows/oneoff-dasha-event.yml

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Wait for category fix and repair managed events
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd "$HOME/bot_project"

          ready=0
          for _ in $(seq 1 60); do
            if grep -q '"люблю"' modules/calendar.py && grep -q 'googleEventColors' web/mobile-ui.js; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "$ready" != "1" ]; then
            echo "CATEGORY_FIX_NOT_DEPLOYED"
            exit 1
          fi

          .venv/bin/python - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          from core.category_store import get_category_colors
          from core.db import get_google_account, get_user_timezone
          from modules.calendar import _detect_category
          from modules.calendar_user import _get_calendar_service, _list_events
          from modules.event_detail_api import _description_with_category

          user_id = 2
          expected_name = "Darya Potyazhenko"
          account = get_google_account(user_id) or {}
          if str(account.get("name") or "").strip() != expected_name:
              raise SystemExit("TARGET_USER_MISMATCH")

          timezone_name = get_user_timezone(user_id, default="Europe/Moscow") or "Europe/Moscow"
          zone = ZoneInfo(timezone_name)
          now = datetime.now(zone)
          colors = get_category_colors(user_id)
          service = _get_calendar_service(user_id)

          marker = "AI Smart Planner category: other"
          processed = set()
          changed = []

          events = _list_events(user_id, now - timedelta(days=60), now + timedelta(days=400))
          for event in events:
              description = str(event.get("description") or "")
              if marker not in description:
                  continue

              target_id = str(event.get("recurringEventId") or event.get("id") or "")
              if not target_id or target_id in processed:
                  continue
              processed.add(target_id)

              target = service.events().get(calendarId="primary", eventId=target_id).execute()
              target_description = str(target.get("description") or "")
              if marker not in target_description:
                  continue

              summary = " ".join(str(target.get("summary") or "").split())
              category, color_id = _detect_category(summary, colors)
              if category in {"other", "uncategorized"} or category not in colors or not color_id:
                  continue

              patch = {
                  "description": _description_with_category(target_description, category),
                  "colorId": str(color_id),
              }
              service.events().patch(calendarId="primary", eventId=target_id, body=patch).execute()
              changed.append((target_id, category, summary))
              print(f"MIGRATED category={category} title={summary!r}")

          remaining = []
          verify_events = _list_events(user_id, now - timedelta(days=60), now + timedelta(days=400))
          for event in verify_events:
              description = str(event.get("description") or "")
              if marker not in description:
                  continue
              summary = " ".join(str(event.get("summary") or "").split())
              category, color_id = _detect_category(summary, colors)
              if category not in {"other", "uncategorized"} and color_id:
                  remaining.append(summary)

          print(f"MIGRATED_COUNT={len(changed)}")
          print(f"RECLASSIFIABLE_OTHER_REMAINING={len(remaining)}")
          if remaining:
              raise SystemExit("CATEGORY_REPAIR_NOT_VERIFIED")
          PY
          REMOTE
