name: oneoff-add-dasha-event-20260922

on:
  push:
    branches:
      - ops/dasha-event-20260922
    paths:
      - .github/workflows/oneoff-dasha-event.yml

permissions:
  contents: read

jobs:
  add-event:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Add event through application calendar logic
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd "$HOME/bot_project"
          .venv/bin/python - <<'PY'
          from datetime import datetime, timedelta, time
          from zoneinfo import ZoneInfo

          from core.db import get_google_account, get_google_token, get_user_timezone
          from modules.calendar_availability import create_event_in_slot
          from modules.calendar_user import _list_events, _event_start

          user_id = 2
          expected_name = "Darya Potyazhenko"
          title = "Я тебя люблю"

          account = get_google_account(user_id) or {}
          actual_name = str(account.get("name") or "").strip()
          if actual_name != expected_name:
              raise SystemExit(f"TARGET_USER_MISMATCH user_id={user_id} name={actual_name!r}")
          if not get_google_token(user_id):
              raise SystemExit("TARGET_CALENDAR_NOT_CONNECTED")

          timezone_name = get_user_timezone(user_id, default="Europe/Moscow") or "Europe/Moscow"
          zone = ZoneInfo(timezone_name)
          start = datetime.combine(datetime.now(zone).date(), time(11, 0), tzinfo=zone)
          end = start + timedelta(hours=1)

          def exact_event_exists():
              events = _list_events(user_id, start - timedelta(minutes=1), end + timedelta(minutes=1))
              for event in events:
                  if str(event.get("summary") or "").strip() != title:
                      continue
                  event_start, all_day = _event_start(event, timezone_name)
                  if not all_day and event_start and event_start.astimezone(zone) == start:
                      return event
              return None

          existing = exact_event_exists()
          if existing:
              print(
                  f"EVENT_ALREADY_EXISTS user_id={user_id} timezone={timezone_name} "
                  f"start={start.isoformat()} end={end.isoformat()} event_id={existing.get('id','')}"
              )
              raise SystemExit(0)

          create_event_in_slot(
              user_id,
              timezone_name,
              title,
              start,
              end,
              allow_non_workday=True,
          )

          created = exact_event_exists()
          if not created:
              raise SystemExit("EVENT_CREATE_NOT_VERIFIED")

          print(
              f"EVENT_CREATED user_id={user_id} timezone={timezone_name} "
              f"start={start.isoformat()} end={end.isoformat()} event_id={created.get('id','')}"
          )
          PY
          REMOTE
