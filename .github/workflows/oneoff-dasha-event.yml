name: oneoff-add-dasha-event-20260922

on:
  push:
    branches:
      - ops/dasha-event-20260922
    paths:
      - .github/workflows/oneoff-dasha-event.yml

permissions:
  contents: read

jobs:
  discover-user:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: List application user display names
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd "$HOME/bot_project"
          .venv/bin/python - <<'PY'
          from core.db import conn, db_lock, get_google_token

          with db_lock:
              rows = conn.execute(
                  "SELECT u.user_id, COALESCE(ia.name,ga.name,u.name,''), "
                  "COALESCE(ia.provider,'legacy') "
                  "FROM users u "
                  "LEFT JOIN identity_accounts ia ON ia.user_id=u.user_id "
                  "LEFT JOIN google_accounts ga ON ga.user_id=u.user_id "
                  "ORDER BY u.user_id"
              ).fetchall()

          print(f"USER_COUNT={len(rows)}")
          for user_id, name, provider in rows:
              clean_name = " ".join(str(name or "").split())
              print(
                  f"USER user_id={int(user_id)} provider={provider} "
                  f"name={clean_name!r} calendar_connected={bool(get_google_token(int(user_id)))}"
              )
          PY
          REMOTE
