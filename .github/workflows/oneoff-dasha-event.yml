name: diagnose-dasha-app-events

on:
  push:
    branches:
      - ops/dasha-event-20260922
    paths:
      - .github/workflows/oneoff-dasha-event.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Inspect Smart Planner events
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd "$HOME/bot_project"
          .venv/bin/python - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from core.db import get_user_timezone
          from modules.calendar import _detect_category
          from core.category_store import get_category_colors
          from modules.calendar_user import _list_events

          user_id = 2
          timezone_name = get_user_timezone(user_id, default="Europe/Moscow") or "Europe/Moscow"
          zone = ZoneInfo(timezone_name)
          now = datetime.now(zone)
          colors = get_category_colors(user_id)
          events = _list_events(user_id, now - timedelta(days=30), now + timedelta(days=30))
          smart = []
          for event in events:
              description = str(event.get("description") or "")
              if "AI Smart Planner category:" not in description:
                  continue
              category = description.split("AI Smart Planner category:",1)[1].splitlines()[0].strip()
              summary = " ".join(str(event.get("summary") or "").split())
              predicted = _detect_category(summary, colors)
              start_value = (event.get("start") or {}).get("dateTime") or (event.get("start") or {}).get("date") or ""
              smart.append((start_value, summary, category, event.get("colorId"), predicted))
          print(f"SMART_EVENT_COUNT={len(smart)}")
          for start_value, summary, category, color_id, predicted in smart[-60:]:
              print(
                  f"SMART start={start_value} category={category!r} color_id={color_id!r} "
                  f"predicted={predicted!r} summary={summary!r}"
              )
          PY
          REMOTE
