name: verify-dasha-category-fix

on:
  push:
    branches:
      - ops/dasha-event-20260922
    paths:
      - .github/workflows/oneoff-dasha-event.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Verify live classifier
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd "$HOME/bot_project"
          .venv/bin/python - <<'PY'
          from modules.router import route_text  # installs runtime category hooks
          from modules.calendar import _detect_category
          from core.category_store import get_category_colors

          colors = get_category_colors(2)
          cases = (
              "ужин с Лешкой",
              "я тебя люблю",
              "сделать текст рассылки",
              "уборка квартиры",
              "рейс в Москву",
          )
          for text in cases:
              print(f"CHECK {text!r} -> {_detect_category(text, colors)!r}")
          PY
          REMOTE
