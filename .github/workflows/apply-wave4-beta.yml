name: Apply final beta parser fixes

on:
  push:
    branches:
      - beta/hard-user-parser-final

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta/hard-user-parser-final
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply final beta fixes
        run: python .github/apply_wave4_parser_fix.py
      - name: Compile Python sources
        run: python -m compileall -q bot.py web_app.py config.py core handlers integrations modules tests
      - name: Run full test suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check whitespace
        run: git diff --check
      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/calendar.py modules/router.py
          git commit -m "fix: close final parser beta gaps [skip ci]"
          git push origin HEAD:beta/hard-user-parser-final
