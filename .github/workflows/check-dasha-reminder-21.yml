name: check-dasha-reminder-21

on:
  push:
    branches:
      - ops/check-dasha-reminder-21
    paths:
      - .github/workflows/check-dasha-reminder-21.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Check reminder delivery
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd "$HOME/bot_project"
          .venv/bin/python - <<'PY'
          from core.db import conn, db_lock
          from core.library_store import get_saved_reminder
          from core.push_store import list_push_subscriptions

          user_id=2
          reminder_id=21
          r=get_saved_reminder(user_id, reminder_id)
          print("REMINDER="+repr(r))
          subs=list_push_subscriptions(user_id)
          print(f"PUSH_SUBSCRIPTIONS={len(subs)}")
          with db_lock:
              rows=conn.execute(
                  "SELECT reminder_id,status,remind_at,delivered_at,delivery_attempts,last_error,lease_until,deleted_at "
                  "FROM reminders WHERE reminder_id=? AND user_id=?",
                  (reminder_id,user_id)
              ).fetchall()
          print("DB_ROWS="+repr(rows))
          PY
          echo '--- JOURNAL ---'
          journalctl -u personal-secretary.service --since "2026-09-22 16:50:00" --until "2026-09-22 17:05:00" --no-pager 2>/dev/null | tail -n 200 || true
          REMOTE
