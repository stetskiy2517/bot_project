name: Offline review dependencies
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  wheels:
    if: github.head_ref == 'release/security-approved-p2-p8'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip wheel -q -r requirements.txt Flask==3.1.2 --wheel-dir wheels
      - uses: actions/upload-artifact@v4
        with:
          name: offline-review-wheels
          path: wheels/
          retention-days: 1
