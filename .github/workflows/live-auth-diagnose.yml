name: live-auth-diagnose-20260925

on:
  push:
    branches:
      - ops/live-auth-diagnose-20260925
    paths:
      - .github/workflows/live-auth-diagnose.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Diagnose live Google auth and calendar access
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd "$HOME/bot_project"
          echo "DEPLOYED_SHA=$(git rev-parse HEAD)"
          .venv/bin/python - <<'PY'
          import json
          import time
          from datetime import datetime, timezone
          from core.db import conn, db_lock, get_google_token

          with db_lock:
              users = conn.execute(
                  "SELECT u.user_id, COALESCE(ga.name,u.name,''), COALESCE(ga.email,'') "
                  "FROM users u LEFT JOIN google_accounts ga ON ga.user_id=u.user_id "
                  "ORDER BY u.user_id"
              ).fetchall()
          for user_id,name,email in users:
              token = get_google_token(int(user_id))
              scopes = []
              expiry = None
              has_refresh = False
              if isinstance(token, dict):
                  scopes = token.get("scopes") or []
                  expiry = token.get("expiry")
                  has_refresh = bool(token.get("refresh_token"))
              print(
                  f"USER user_id={user_id} name={name!r} token={bool(token)} "
                  f"has_refresh={has_refresh} expiry={expiry!r} scopes={scopes!r}"
              )

          print("--- RECENT_COMMANDS ---")
          cutoff=time.time()-6*3600
          with db_lock:
              rows=conn.execute(
                  "SELECT user_id,request_id,phase,http_status,created_at,response_json "
                  "FROM command_requests WHERE created_at>? ORDER BY created_at DESC LIMIT 120",
                  (cutoff,)
              ).fetchall()
          for user_id,rid,phase,status,created,response in rows:
              text=str(response or "")
              if any(x in text.casefold() for x in ("calendar","google","добав","событ","автор","auth","недоступ")) or status not in (200,None):
                  when=datetime.fromtimestamp(float(created),timezone.utc).isoformat()
                  print(f"REQ user_id={user_id} at={when} status={status} phase={phase} response={text[:1600]!r}")
          PY

          echo "--- LIVE_CALENDAR_PROBES ---"
          .venv/bin/python - <<'PY'
          from datetime import datetime, timedelta, timezone
          from core.db import conn, db_lock, get_google_token
          from integrations.google_calendar_service import build_google_calendar_service

          with db_lock:
              ids=[int(r[0]) for r in conn.execute("SELECT user_id FROM users ORDER BY user_id").fetchall()]
          for user_id in ids:
              if not get_google_token(user_id):
                  continue
              try:
                  service=build_google_calendar_service(user_id)
                  result=service.events().list(
                      calendarId="primary",
                      timeMin=datetime.now(timezone.utc).isoformat(),
                      timeMax=(datetime.now(timezone.utc)+timedelta(days=1)).isoformat(),
                      maxResults=1,
                      singleEvents=True,
                  ).execute()
                  print(f"PROBE user_id={user_id} ok=True items={len(result.get('items') or [])}")
              except Exception as exc:
                  print(f"PROBE user_id={user_id} ok=False error={type(exc).__name__}:{exc}")
          PY

          echo "--- INSERT_DELETE_PROBE ---"
          .venv/bin/python - <<'PY'
          from datetime import datetime, timedelta, timezone
          from integrations.google_calendar_service import build_google_calendar_service

          user_id=1
          service=build_google_calendar_service(user_id)
          start=datetime.now(timezone.utc)+timedelta(minutes=30)
          end=start+timedelta(minutes=5)
          body={
              "summary":"Personal Secretary auth probe",
              "description":"Temporary connectivity probe. Auto-deleted.",
              "start":{"dateTime":start.isoformat(),"timeZone":"UTC"},
              "end":{"dateTime":end.isoformat(),"timeZone":"UTC"},
          }
          created=None
          try:
              created=service.events().insert(calendarId="primary",body=body,sendUpdates="none").execute()
              event_id=created.get("id")
              print(f"INSERT_PROBE ok=True event_id={event_id!r}")
              service.events().delete(calendarId="primary",eventId=event_id,sendUpdates="none").execute()
              print("DELETE_PROBE ok=True")
          except Exception as exc:
              print(f"INSERT_PROBE ok=False error={type(exc).__name__}:{exc}")
              if created and created.get("id"):
                  try:
                      service.events().delete(calendarId="primary",eventId=created["id"],sendUpdates="none").execute()
                  except Exception:
                      pass
              raise
          PY

          echo "--- RECENT SERVICE LOGS ---"
          journalctl -u personal-secretary.service --since "2026-09-25 17:30:00" --no-pager 2>/dev/null | grep -Ei 'google|calendar|auth|invalid_grant|permission|событ|добав|command request failed|GOOGLE_AUTH_REQUIRED|POST /api/chat' | tail -n 500 || true
          REMOTE
