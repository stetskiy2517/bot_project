name: temporary-install-hardening-payload

on:
  push:
    branches:
      - codex/navigation-user-behavior-hardening

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/navigation-user-behavior-hardening
          fetch-depth: 0

      - name: Install verified payload
        shell: bash
        run: |
          base64 -d .tmp/hardening.tar.gz.b64 > /tmp/hardening.tar.gz
          tar -xzf /tmp/hardening.tar.gz
          printf '%s  %s\n' \
            'b7030e80597d2a61be8fdb88bb900424dc99e0752a9d73d72335bfa139e8dce2' 'modules/router.py' \
            'f6f6761f29c0d40ddf8ddbb9a083d475cc5f53122f8efb5ae1d1144266d76051' 'modules/navigation.py' \
            '3d16b9ee41db8d8259a7ca6854eb31a430c55c25d3ba38012c9592cde8c5a482' 'tests/test_navigation_user_behavior.py' \
            | sha256sum -c -
          rm -rf .tmp
          python -m py_compile modules/router.py modules/navigation.py tests/test_navigation_user_behavior.py
          git diff --check

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/router.py modules/navigation.py tests/test_navigation_user_behavior.py
          git rm .github/workflows/tmp-install-hardening-payload.yml
          git add -A .tmp || true
          git commit -m 'Harden natural calendar and navigation commands'
          git push origin HEAD:codex/navigation-user-behavior-hardening
