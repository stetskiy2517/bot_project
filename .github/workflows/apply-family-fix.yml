name: Apply family category beta fix

on:
  push:
    branches:
      - fix/family-category-beta

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/family-category-beta
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply family category fix v2
        run: python .github/apply_family_fix.py
      - name: Compile Python sources
        run: python -m compileall -q bot.py web_app.py config.py core handlers integrations modules tests
      - name: Run full test suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check diff whitespace
        run: git diff --check
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/db.py modules/calendar.py web_app.py web/index.html tests/test_calendar_regression_audit.py tests/test_web_app.py tests/test_category_beta_matrix.py
          git commit -m "fix: restore family category and harden category settings [skip ci]"
          git push origin HEAD:fix/family-category-beta
