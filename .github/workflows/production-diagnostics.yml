name: production-diagnostics

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: "Optional user id. Empty = most recently active user."
        required: false
        type: string
      activity_limit:
        description: "Activity rows to collect (1-500)."
        required: false
        default: "250"
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/workflows/production-diagnostics.yml"

permissions:
  contents: read

concurrency:
  group: production-diagnostics
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST" || { echo "DEPLOY_HOST is not configured"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "DEPLOY_USER is not configured"; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo "DEPLOY_SSH_KEY is not configured"; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo "DEPLOY_KNOWN_HOSTS is not configured"; exit 1; }

      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload diagnostics collector
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp             -i ~/.ssh/deploy_key             -o BatchMode=yes             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=yes             scripts/collect_production_diagnostics.py             "$DEPLOY_USER@$DEPLOY_HOST:/tmp/personal-secretary-diagnostics.py"

      - name: Collect production diagnostics
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          USER_ID: ${{ github.event.inputs.user_id || '' }}
          ACTIVITY_LIMIT: ${{ github.event.inputs.activity_limit || '250' }}
        run: |
          set -euo pipefail
          USER_ARG=""
          if [ -n "$USER_ID" ]; then
            case "$USER_ID" in
              *[!0-9]*|"") echo "Invalid user_id"; exit 1 ;;
              *) USER_ARG="--user-id $USER_ID" ;;
            esac
          fi
          case "$ACTIVITY_LIMIT" in
            *[!0-9]*|"") echo "Invalid activity_limit"; exit 1 ;;
          esac
          ssh             -i ~/.ssh/deploy_key             -o BatchMode=yes             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=yes             "$DEPLOY_USER@$DEPLOY_HOST"             "python3 /tmp/personal-secretary-diagnostics.py               --project-dir \"\$HOME/bot_project\"               $USER_ARG               --limit $ACTIVITY_LIMIT               --journal-lines 350               --output /tmp/personal-secretary-diagnostics.json"
          scp             -i ~/.ssh/deploy_key             -o BatchMode=yes             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=yes             "$DEPLOY_USER@$DEPLOY_HOST:/tmp/personal-secretary-diagnostics.json"             ./production-diagnostics.json

      - name: Verify bundle
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("production-diagnostics.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          print("selected_user_id:", data.get("selected_user_id"))
          print("selection:", data.get("selection"))
          print("activity_rows:", len(data.get("activity") or []))
          print("git_head:", data.get("git_head"))
          PY

      - name: Upload diagnostics artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-diagnostics
          path: production-diagnostics.json
          retention-days: 1
          if-no-files-found: error
