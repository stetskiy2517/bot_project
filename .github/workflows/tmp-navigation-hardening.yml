name: temporary-navigation-hardening

on:
  push:
    branches:
      - codex/navigation-user-behavior-hardening

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/navigation-user-behavior-hardening
          fetch-depth: 0

      - name: Apply natural command hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          router_path = Path('modules/router.py')
          router = router_path.read_text(encoding='utf-8')

          event_start = router.index('EVENT_WORDS = (')
          action_start = router.index('ACTION_WORDS = (', event_start)
          event_block = '''EVENT_WORDS = (
              "встреч", "созвон", "звонок", "врач", "невролог", "стоматолог", "мрт", "узи",
              "трениров", "зал", "кино", "ресторан", "рейс", "полет", "полёт", "поезд", "такси", "совещ",
              "планерк", "клиент", "переговор", "день рождения", "обед", "ужин", "завтрак",
              "отпуск", "командиров", "прогул", "прагул", "погуля", "прогуля", "пробеж", "кафе", "театр", "концерт",
              "выстав", "музей", "бассейн", "футбол", "матч", "кофе", "массаж", "парикмах",
              "барбер", "маникюр", "стриж", "занят", "урок", "лекци", "экзамен", "прием", "приём", "йог", "пилатес", "тренеров",
          )
          BARE_CREATE_EVENT_WORDS = (
              "встреч", "созвон", "звонок", "врач", "невролог", "стоматолог", "мрт", "узи",
              "трениров", "кино", "совещ", "планерк", "переговор", "день рождения", "обед", "ужин",
              "завтрак", "отпуск", "командиров", "прогул", "прагул", "погуля", "прогуля", "пробеж", "поездк", "театр", "концерт",
              "выстав", "музей", "бассейн", "футбол", "матч", "массаж", "парикмах", "барбер",
              "маникюр", "стриж", "занят", "урок", "лекци", "экзамен", "прием", "приём", "йог", "пилатес", "тренеров",
          )
          '''
          router = router[:event_start] + event_block + router[action_start:]

          info_marker = 'INFO_CREATE_QUESTION_RE = re.compile('
          if 'BARE_EVENT_STATEMENT_RE = re.compile(' not in router:
              idx = router.index(info_marker)
              router = router[:idx] + '''BARE_EVENT_STATEMENT_RE = re.compile(
              r"\\b(?:люблю|нравит\\w*|полезн\\w*|обычно|часто|редко|был\\w*|была|были|прошл\\w*|"
              r"прошел|прошёл|прошла|закончил\\w*|состоял\\w*)\\b",
              re.IGNORECASE,
          )
          ''' + router[idx:]

          current_marker = 'CURRENT_STATE_RE = re.compile('
          if 'LEADING_BARE_HOUR_RE = re.compile(' not in router:
              idx = router.index(current_marker)
              router = router[:idx] + '''LEADING_BARE_HOUR_RE = re.compile(
              r"^\\s*(?P<hour>[01]?\\d|2[0-3])\\s+(?P<body>\\D.+)$",
              re.IGNORECASE,
          )
          ''' + router[idx:]

          creation_start = router.index('def _creation_text(text: str) -> str:')
          action_fn_start = router.index('def _action_text(text: str) -> str:', creation_start)
          normalise_end_marker = '    return normal\n\n\n'
          normalise_pos = router.rfind(normalise_end_marker, 0, creation_start)
          if normalise_pos < 0:
              raise RuntimeError('router normalise marker not found')
          helper_pos = normalise_pos + len(normalise_end_marker)
          if 'def _contains_event_marker(' not in router:
              helpers = '''def _contains_event_marker(text: str) -> bool:
              return any(word in text for word in EVENT_WORDS)
          
          
          def _looks_like_bare_event(text: str) -> bool:
              normal = _normalise(text)
              if BARE_EVENT_STATEMENT_RE.search(normal):
                  return False
              tokens = re.findall(r"[a-zа-я0-9]+", normal)
              if len(tokens) > 10:
                  return False
              if any(normal.startswith(word) for word in BARE_CREATE_EVENT_WORDS):
                  return True
              if re.match(r"^(?:после|перед)\\b", normal) and any(word in normal for word in BARE_CREATE_EVENT_WORDS):
                  return True
              return False
          
          
          '''
              router = router[:helper_pos] + helpers + router[helper_pos:]
              creation_start = router.index('def _creation_text(text: str) -> str:')
              action_fn_start = router.index('def _action_text(text: str) -> str:', creation_start)

          creation_fn = '''def _creation_text(text: str) -> str:
              """Исправить безопасные разговорные/ASR-варианты только для создания события."""
              result = text
              if REMIND_ME_AS_COMMAND_RE.search(result):
                  result = REMIND_ME_AS_COMMAND_RE.sub("напомни", result, count=1)
          
              lower = _normalise(result)
              command_like = (
                  bool(DATE_HINT_RE.search(lower))
                  or any(word in lower for word in CREATE_WORDS)
                  or _contains_event_marker(lower)
                  or _looks_like_bare_event(lower)
              )
              if command_like and _extract_time(lower) is None:
                  match = TRAILING_BARE_HOUR_RE.search(result)
                  if match:
                      hour = match.group("hour")
                      punct = match.group("punct") or ""
                      result = f"{result[:match.start('hour')]}в {hour}{punct}"
                      lower = _normalise(result)
          
              if command_like and _extract_time(lower) is None:
                  leading = LEADING_BARE_HOUR_RE.match(result)
                  if leading:
                      result = f"в {leading.group('hour')} {leading.group('body').strip()}"
              return result
          
          
          '''
          router = router[:creation_start] + creation_fn + router[action_fn_start:]

          old = '''    if NON_EVENT_STATEMENT_RE.search(lower):
              return IntentResult(INTENT_UNKNOWN, 0.0)
          
              has_event = any(word in lower for word in EVENT_WORDS)
          '''
          new = '''    if NON_EVENT_STATEMENT_RE.search(lower):
              return IntentResult(INTENT_UNKNOWN, 0.0)
              if BARE_EVENT_STATEMENT_RE.search(lower):
                  return IntentResult(INTENT_UNKNOWN, 0.0)
          
              has_event = _contains_event_marker(lower)
          '''
          if old not in router:
              raise RuntimeError('detect_intent marker not found')
          router = router.replace(old, new, 1)

          old = '''    if has_action and (has_date or has_time) and not is_question and not is_current_state:
              return IntentResult(INTENT_CREATE, 0.84)
              return IntentResult(INTENT_UNKNOWN, 0.0)
          '''
          new = '''    if has_action and (has_date or has_time) and not is_question and not is_current_state:
              return IntentResult(INTENT_CREATE, 0.84)
              if _looks_like_bare_event(lower) and not is_question and not is_current_state:
                  return IntentResult(INTENT_CREATE, 0.76)
              return IntentResult(INTENT_UNKNOWN, 0.0)
          '''
          if old not in router:
              raise RuntimeError('bare create insertion marker not found')
          router = router.replace(old, new, 1)

          needs_start = router.index('def _needs_time(text: str) -> bool:')
          pending_start = router.index('def _pending(', needs_start)
          needs_fn = '''def _needs_time(text: str) -> bool:
              if is_all_day(text):
                  return False
              lower = _normalise(text)
              if _extract_time(lower) is not None or _relative_offset(lower) is not None:
                  return False
              return bool(
                  DATE_HINT_RE.search(lower)
                  or any(word in lower for word in CREATE_WORDS)
                  or _looks_like_bare_event(lower)
              )
          
          
          '''
          router = router[:needs_start] + needs_fn + router[pending_start:]

          old = '    combined = f"{pending[\'text\']} {reply}"\n'
          new = '    combined = _creation_text(f"{pending[\'text\']} {reply}")\n'
          if old not in router:
              raise RuntimeError('pending combine marker not found')
          router = router.replace(old, new, 1)
          router = router.replace(
              '        await update.message.reply_text("Не понял время. Напиши, например: 19:00, 19 или в 7 вечера.")',
              '        await update.message.reply_text("Не понял время. Напиши, например: 19:00, 19 или «завтра в 19».")',
              1,
          )

          old = '    return any(marker in lower for marker in calendar_markers)\n\n\ndef _blocks_active_note_append'
          new = '    return any(marker in lower for marker in calendar_markers) or _looks_like_bare_event(lower)\n\n\ndef _blocks_active_note_append'
          if old not in router:
              raise RuntimeError('calendar reference marker not found')
          router = router.replace(old, new, 1)

          old = '''        if _needs_time(create_text):
              context.user_data["smart_planner_pending"] = {"type": "create_time", "text": create_text}
              await update.message.reply_text("Во сколько поставить событие?")
              return True
          '''
          new = '''        if _needs_time(create_text):
              context.user_data["smart_planner_pending"] = {"type": "create_time", "text": create_text}
              if DATE_HINT_RE.search(_normalise(create_text)):
                  prompt = "Во сколько поставить событие?"
              else:
                  prompt = "Когда поставить событие? Напиши, например: «22:00» или «завтра в 19»."
              await update.message.reply_text(prompt)
              return True
          '''
          if old not in router:
              raise RuntimeError('create prompt marker not found')
          router = router.replace(old, new, 1)
          router_path.write_text(router, encoding='utf-8')

          nav_path = Path('modules/navigation.py')
          nav = nav_path.read_text(encoding='utf-8')
          temporal_marker = 'TEMPORAL_DESTINATION_RE = re.compile('
          idx = nav.index(temporal_marker)
          if 'BARE_ACTIVITY_DESTINATION_RE = re.compile(' not in nav:
              additions = '''WALK_THROUGH_DESTINATION_RE = re.compile(
              r"^\\s*(?:прогул\\w*|прагул\\w*|погуля\\w*|прогуля\\w*|пробеж\\w*)\\s+по\\s+(?P<location>.+?)\\s*$",
              re.IGNORECASE,
          )
          BARE_ACTIVITY_DESTINATION_RE = re.compile(
              r"^\\s*(?:"
              r"прогул\\w*|прагул\\w*|погуля\\w*|прогуля\\w*|пробеж\\w*|"
              r"трениров\\w*|тренеров\\w*|поездк\\w*|поех\\w*"
              r")\\s+(?P<location>.+?)\\s*$",
              re.IGNORECASE,
          )
          '''
              nav = nav[:idx] + additions + nav[idx:]

          home_marker = 'HOME_PLACE_RE = re.compile('
          idx = nav.index(home_marker)
          if 'NON_LOCATION_TAIL_RE = re.compile(' not in nav:
              nav = nav[:idx] + '''NON_LOCATION_TAIL_RE = re.compile(
              r"^(?:с|со|у|для|к|от|до|через|после|перед|вместе\\s+с)\\b",
              re.IGNORECASE,
          )
          ''' + nav[idx:]

          clean_start = nav.index('def _clean_destination_candidate(')
          event_dest_start = nav.index('def _event_destination(', clean_start)
          destination_functions = '''def _clean_destination_candidate(value: str, *, bare_activity: bool = False) -> str | None:
              candidate = re.sub(r"\\s+", " ", value).strip(" ,.;")
              candidate = re.split(
                  r"\\s+(?:после|перед)\\s+",
                  candidate,
                  maxsplit=1,
                  flags=re.IGNORECASE,
              )[0].strip(" ,.;")
              if not candidate:
                  return None
              normalized = _normalise_place_text(candidate)
              if TEMPORAL_DESTINATION_RE.fullmatch(normalized):
                  return None
              if bare_activity and NON_LOCATION_TAIL_RE.match(normalized):
                  return None
              return candidate[:500]
          
          
          def _summary_destination(summary: str) -> str | None:
              match = NATURAL_DESTINATION_RE.search(summary)
              if match:
                  return _clean_destination_candidate(match.group("location"))
          
              match = PREPOSITIONAL_DESTINATION_RE.search(summary)
              if match:
                  return _clean_destination_candidate(match.group("location"))
          
              match = WALK_THROUGH_DESTINATION_RE.match(summary)
              if match:
                  return _clean_destination_candidate(match.group("location"), bare_activity=True)
          
              match = BARE_ACTIVITY_DESTINATION_RE.match(summary)
              if not match:
                  return None
              return _clean_destination_candidate(match.group("location"), bare_activity=True)
          
          
          '''
          nav = nav[:clean_start] + destination_functions + nav[event_dest_start:]
          nav_path.write_text(nav, encoding='utf-8')

          test_b64 = ''
          Path('tests/test_navigation_user_behavior.py').write_bytes(base64.b64decode(test_b64))
          PY

      - name: Validate generated files
        run: |
          python -m py_compile modules/router.py modules/navigation.py tests/test_navigation_user_behavior.py
          git diff --check

      - name: Commit hardened implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/router.py modules/navigation.py tests/test_navigation_user_behavior.py
          git rm .github/workflows/tmp-navigation-hardening.yml
          git commit -m "Harden natural calendar and navigation commands"
          git push origin HEAD:codex/navigation-user-behavior-hardening
