name: one-off-router-compatibility-patch

on:
  push:
    branches:
      - feat/free-core-ai-entitlements

permissions:
  contents: write

jobs:
  patch-router:
    if: github.event.head_commit.message != 'Preserve free recurring event shorthand'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/free-core-ai-entitlements
          fetch-depth: 0
      - name: Patch deterministic recurrence boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('modules/router.py')
          text = path.read_text(encoding='utf-8')
          old = "    if RECURRENCE_DECLARATION_RE.search(lower):\n        return IntentResult(INTENT_UNKNOWN, 0.0)\n"
          new = "    if RECURRENCE_DECLARATION_RE.search(lower) and (\n        lower.startswith(\"я \") or not _contains_event_marker(lower)\n    ):\n        return IntentResult(INTENT_UNKNOWN, 0.0)\n"
          if text.count(old) != 1:
              raise SystemExit('expected recurrence declaration guard not found exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- modules/router.py; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modules/router.py
          git commit -m 'Preserve free recurring event shorthand'
          git push origin HEAD:feat/free-core-ai-entitlements
