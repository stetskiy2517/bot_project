name: temporary-natural-navigation-hardening

on:
  push:
    branches:
      - codex/navigation-user-behavior-hardening-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/navigation-user-behavior-hardening-v2
          fetch-depth: 0

      - name: Apply hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_function(text: str, name: str, replacement: str) -> str:
              pattern = re.compile(rf"^def {re.escape(name)}\(.*?(?=^def |^async def |\Z)", re.M | re.S)
              match = pattern.search(text)
              if not match:
                  raise RuntimeError(f"function not found: {name}")
              return text[:match.start()] + replacement.rstrip() + "\n\n\n" + text[match.end():]

          def insert_before(text: str, marker: str, addition: str) -> str:
              if addition.strip() in text:
                  return text
              idx = text.index(marker)
              return text[:idx] + addition.rstrip() + "\n" + text[idx:]

          router_path = Path("modules/router.py")
          router = router_path.read_text(encoding="utf-8")
          event_start = router.index("EVENT_WORDS = (")
          action_start = router.index("ACTION_WORDS = (", event_start)
          router = router[:event_start] + '''EVENT_WORDS = (
              "встреч", "созвон", "звонок", "врач", "невролог", "стоматолог", "мрт", "узи",
              "трениров", "зал", "кино", "ресторан", "рейс", "полет", "полёт", "поезд", "такси", "совещ",
              "планерк", "клиент", "переговор", "день рождения", "обед", "ужин", "завтрак",
              "отпуск", "командиров", "прогул", "прагул", "погуля", "прогуля", "пробеж", "театр", "концерт",
              "выстав", "музей", "бассейн", "футбол", "матч", "массаж", "парикмах", "барбер",
              "маникюр", "стриж", "занят", "урок", "лекци", "экзамен", "прием", "приём", "йог", "пилатес",
          )
          BARE_CREATE_EVENT_WORDS = (
              "встреч", "созвон", "звонок", "врач", "невролог", "стоматолог", "мрт", "узи",
              "трениров", "кино", "совещ", "планерк", "переговор", "день рождения", "обед", "ужин", "завтрак",
              "отпуск", "командиров", "прогул", "прагул", "погуля", "прогуля", "пробеж", "поездк", "театр", "концерт",
              "выстав", "музей", "бассейн", "футбол", "матч", "массаж", "парикмах", "барбер",
              "маникюр", "стриж", "занят", "урок", "лекци", "экзамен", "прием", "приём", "йог", "пилатес",
          )
          ''' + router[action_start:]

          router = insert_before(router, "INFO_CREATE_QUESTION_RE = re.compile(", '''BARE_EVENT_STATEMENT_RE = re.compile(
              r"\\b(?:люблю|нравит\\w*|полезн\\w*|обычн\\w*|часто|редко|был\\w*|была|были|прошл\\w*|"
              r"прошел|прошёл|прошла|закончил\\w*|состоял\\w*|тяжел\\w*|тяжёл\\w*)\\b",
              re.IGNORECASE,
          )
          ''')
          router = insert_before(router, "CURRENT_STATE_RE = re.compile(", '''LEADING_BARE_HOUR_RE = re.compile(
              r"^\\s*(?P<hour>[01]?\\d|2[0-3])\\s+(?P<body>\\D.+)$",
              re.IGNORECASE,
          )
          ''')
          router = insert_before(router, "def _creation_text(text: str) -> str:", '''def _contains_event_marker(text: str) -> bool:
              return any(word in text for word in EVENT_WORDS)


          def _looks_like_bare_event(text: str) -> bool:
              normal = _normalise(text)
              if BARE_EVENT_STATEMENT_RE.search(normal):
                  return False
              tokens = re.findall(r"[a-zа-я0-9]+", normal)
              if not tokens or len(tokens) > 10:
                  return False
              if any(normal.startswith(word) for word in BARE_CREATE_EVENT_WORDS):
                  return True
              if re.match(r"^(?:после|перед)\\b", normal) and any(word in normal for word in BARE_CREATE_EVENT_WORDS):
                  return True
              return False


          ''')

          router = replace_function(router, "_creation_text", '''def _creation_text(text: str) -> str:
              result = text
              if REMIND_ME_AS_COMMAND_RE.search(result):
                  result = REMIND_ME_AS_COMMAND_RE.sub("напомни", result, count=1)

              lower = _normalise(result)
              command_like = (
                  bool(DATE_HINT_RE.search(lower))
                  or any(word in lower for word in CREATE_WORDS)
                  or _contains_event_marker(lower)
                  or _looks_like_bare_event(lower)
              )
              if command_like and _extract_time(lower) is None:
                  match = TRAILING_BARE_HOUR_RE.search(result)
                  if match:
                      result = f"{result[:match.start('hour')]}в {match.group('hour')}{match.group('punct') or ''}"
                      lower = _normalise(result)
              if command_like and _extract_time(lower) is None:
                  leading = LEADING_BARE_HOUR_RE.match(result)
                  if leading:
                      result = f"в {leading.group('hour')} {leading.group('body').strip()}"
              return result''')

          detect_start = router.index("def detect_intent(text: str) -> IntentResult:")
          detect_end = router.index("def _needs_time(text: str) -> bool:", detect_start)
          detect = router[detect_start:detect_end]
          detect = detect.replace(
              "    if NON_EVENT_STATEMENT_RE.search(lower):\n        return IntentResult(INTENT_UNKNOWN, 0.0)\n\n    has_event = any(word in lower for word in EVENT_WORDS)\n",
              "    if NON_EVENT_STATEMENT_RE.search(lower):\n        return IntentResult(INTENT_UNKNOWN, 0.0)\n    if BARE_EVENT_STATEMENT_RE.search(lower):\n        return IntentResult(INTENT_UNKNOWN, 0.0)\n\n    has_event = _contains_event_marker(lower)\n",
          )
          detect = detect.replace(
              "    if has_action and (has_date or has_time) and not is_question and not is_current_state:\n        return IntentResult(INTENT_CREATE, 0.84)\n    return IntentResult(INTENT_UNKNOWN, 0.0)\n",
              "    if has_action and (has_date or has_time) and not is_question and not is_current_state:\n        return IntentResult(INTENT_CREATE, 0.84)\n    if _looks_like_bare_event(lower) and not is_question and not is_current_state:\n        return IntentResult(INTENT_CREATE, 0.76)\n    return IntentResult(INTENT_UNKNOWN, 0.0)\n",
          )
          router = router[:detect_start] + detect + router[detect_end:]

          router = replace_function(router, "_needs_time", '''def _needs_time(text: str) -> bool:
              if is_all_day(text):
                  return False
              lower = _normalise(text)
              if _extract_time(lower) is not None or _relative_offset(lower) is not None:
                  return False
              return bool(
                  DATE_HINT_RE.search(lower)
                  or any(word in lower for word in CREATE_WORDS)
                  or _looks_like_bare_event(lower)
              )''')

          router = router.replace(
              '    combined = f"{pending[\'text\']} {reply}"\n',
              '    combined = _creation_text(f"{pending[\'text\']} {reply}")\n',
              1,
          )
          router = router.replace(
              '        await update.message.reply_text("Не понял время. Напиши, например: 19:00, 19 или в 7 вечера.")',
              '        await update.message.reply_text("Не понял время. Напиши, например: 19:00, 19 или «завтра в 19».")',
              1,
          )
          router = router.replace(
              '    return any(marker in lower for marker in calendar_markers)\n',
              '    return any(marker in lower for marker in calendar_markers) or _looks_like_bare_event(lower)\n',
              1,
          )
          old_prompt = '''        if _needs_time(create_text):
              context.user_data["smart_planner_pending"] = {"type": "create_time", "text": create_text}
              await update.message.reply_text("Во сколько поставить событие?")
              return True
          '''
          if old_prompt not in router:
              raise RuntimeError("create-time prompt block not found")
          router = router.replace(old_prompt, '''        if _needs_time(create_text):
              context.user_data["smart_planner_pending"] = {"type": "create_time", "text": create_text}
              if DATE_HINT_RE.search(_normalise(create_text)):
                  prompt = "Во сколько поставить событие?"
              else:
                  prompt = "Когда поставить событие? Напиши, например: «22:00» или «завтра в 19»."
              await update.message.reply_text(prompt)
              return True
          ''', 1)
          router_path.write_text(router, encoding="utf-8")

          nav_path = Path("modules/navigation.py")
          nav = nav_path.read_text(encoding="utf-8")
          nav = nav.replace(
              "from core.navigation_store import get_navigation_preferences\n",
              "from core.location_context import current_location_origin\nfrom core.navigation_store import get_navigation_preferences\n",
              1,
          )
          nav = insert_before(nav, "TEMPORAL_DESTINATION_RE = re.compile(", '''WALK_THROUGH_DESTINATION_RE = re.compile(
              r"^\\s*(?:прогул\\w*|прагул\\w*|погуля\\w*|прогуля\\w*|пробеж\\w*)\\s+по\\s+(?P<location>.+?)\\s*$",
              re.IGNORECASE,
          )
          BARE_ACTIVITY_DESTINATION_RE = re.compile(
              r"^\\s*(?:прогул\\w*|прагул\\w*|погуля\\w*|прогуля\\w*|пробеж\\w*|трениров\\w*|поездк\\w*|поех\\w*)\\s+(?P<location>.+?)\\s*$",
              re.IGNORECASE,
          )
          ''')
          nav = insert_before(nav, "HOME_PLACE_RE = re.compile(", '''NON_LOCATION_TAIL_RE = re.compile(
              r"^(?:с|со|у|для|к|от|до|через|после|перед|вместе\\s+с)\\b",
              re.IGNORECASE,
          )
          ''')
          nav = replace_function(nav, "_clean_destination_candidate", '''def _clean_destination_candidate(value: str, *, bare_activity: bool = False) -> str | None:
              candidate = re.sub(r"\\s+", " ", value).strip(" ,.;")
              candidate = re.split(r"\\s+(?:после|перед)\\s+", candidate, maxsplit=1, flags=re.IGNORECASE)[0].strip(" ,.;")
              if not candidate:
                  return None
              normalized = _normalise_place_text(candidate)
              if TEMPORAL_DESTINATION_RE.fullmatch(normalized):
                  return None
              if bare_activity and NON_LOCATION_TAIL_RE.match(normalized):
                  return None
              return candidate[:500]''')
          nav = replace_function(nav, "_summary_destination", '''def _summary_destination(summary: str) -> str | None:
              match = NATURAL_DESTINATION_RE.search(summary)
              if match:
                  return _clean_destination_candidate(match.group("location"))
              match = PREPOSITIONAL_DESTINATION_RE.search(summary)
              if match:
                  return _clean_destination_candidate(match.group("location"))
              match = WALK_THROUGH_DESTINATION_RE.match(summary)
              if match:
                  return _clean_destination_candidate(match.group("location"), bare_activity=True)
              match = BARE_ACTIVITY_DESTINATION_RE.match(summary)
              if match:
                  return _clean_destination_candidate(match.group("location"), bare_activity=True)
              return None''')
          nav = replace_function(nav, "resolve_origin", '''def resolve_origin(
              user_id: int,
              target_event: dict,
              timezone: str,
              preferences: dict | None = None,
          ) -> str | None:
              live_origin = current_location_origin(user_id)
              if live_origin:
                  return live_origin
              prefs = preferences or get_navigation_preferences(user_id)
              previous = _previous_event_origin(user_id, target_event, timezone, prefs)
              if previous:
                  return previous
              return str(prefs.get("default_origin") or "").strip() or None''')
          nav_path.write_text(nav, encoding="utf-8")

          Path("core/location_context.py").write_text('''from __future__ import annotations

from dataclasses import dataclass
from datetime import datetime, timedelta, timezone
import threading

_LOCATION_TTL = timedelta(minutes=15)
_lock = threading.RLock()
_locations: dict[int, "CurrentLocation"] = {}


@dataclass(frozen=True)
class CurrentLocation:
    latitude: float
    longitude: float
    accuracy_meters: float | None
    captured_at: datetime


def save_current_location(user_id: int, latitude: float, longitude: float, accuracy_meters: float | None = None) -> CurrentLocation:
    latitude = float(latitude)
    longitude = float(longitude)
    if not -90 <= latitude <= 90 or not -180 <= longitude <= 180:
        raise ValueError("Некорректные координаты")
    accuracy = None if accuracy_meters is None else max(0.0, float(accuracy_meters))
    location = CurrentLocation(latitude, longitude, accuracy, datetime.now(timezone.utc))
    with _lock:
        _locations[int(user_id)] = location
    return location


def get_current_location(user_id: int) -> CurrentLocation | None:
    with _lock:
        location = _locations.get(int(user_id))
        if not location:
            return None
        if datetime.now(timezone.utc) - location.captured_at > _LOCATION_TTL:
            _locations.pop(int(user_id), None)
            return None
        return location


def current_location_origin(user_id: int) -> str | None:
    location = get_current_location(user_id)
    if not location:
        return None
    return f"geo:{location.latitude:.7f},{location.longitude:.7f}"
''', encoding="utf-8")

          ors_path = Path("integrations/navigation_ors.py")
          ors = ors_path.read_text(encoding="utf-8")
          if "import re\n" not in ors:
              ors = ors.replace("import math\n", "import math\nimport re\n", 1)
          ors = insert_before(ors, "def geocode(address: str) -> tuple[float, float]:", '''GEO_ORIGIN_RE = re.compile(r"^geo:(?P<lat>[+-]?\\d+(?:\\.\\d+)?),(?P<lon>[+-]?\\d+(?:\\.\\d+)?)$")


def _coordinate_origin(value: str) -> tuple[float, float] | None:
              match = GEO_ORIGIN_RE.fullmatch(value.strip())
              if not match:
                  return None
              lat = float(match.group("lat"))
              lon = float(match.group("lon"))
              if not -90 <= lat <= 90 or not -180 <= lon <= 180:
                  raise ValueError("Invalid current location coordinates")
              return lon, lat


          ''')
          ors = replace_function(ors, "geocode", '''def geocode(address: str) -> tuple[float, float]:
              raw = str(address).strip()
              coordinate = _coordinate_origin(raw)
              if coordinate:
                  return coordinate
              value = _normalize_address(raw)
              response = requests.get(
                  GEOCODER_URL,
                  headers={"Authorization": _require_key()},
                  params={"text": value, "size": 1, "lang": "ru"},
                  timeout=REQUEST_TIMEOUT_SECONDS,
              )
              response.raise_for_status()
              return _point_from_geocode(response.json())''')
          ors_path.write_text(ors, encoding="utf-8")

          dgis_path = Path("integrations/navigation_2gis.py")
          dgis = dgis_path.read_text(encoding="utf-8")
          dgis = insert_before(dgis, "def geocode(address: str) -> tuple[float, float]:", '''GEO_ORIGIN_RE = re.compile(r"^geo:(?P<lat>[+-]?\\d+(?:\\.\\d+)?),(?P<lon>[+-]?\\d+(?:\\.\\d+)?)$")


def _coordinate_origin(value: str) -> tuple[float, float] | None:
              match = GEO_ORIGIN_RE.fullmatch(value.strip())
              if not match:
                  return None
              lat = float(match.group("lat"))
              lon = float(match.group("lon"))
              if not -90 <= lat <= 90 or not -180 <= lon <= 180:
                  raise ValueError("Invalid current location coordinates")
              return lat, lon


          ''')
          dgis = replace_function(dgis, "geocode", '''def geocode(address: str) -> tuple[float, float]:
              raw = str(address).strip()
              coordinate = _coordinate_origin(raw)
              if coordinate:
                  return coordinate
              value = " ".join(raw.split()).strip(" ,.;")
              if not value:
                  raise ValueError("Address is required")
              response = requests.get(
                  GEOCODER_URL,
                  params={
                      "q": value,
                      "fields": "items.point,items.geometry.centroid",
                      "locale": "ru_RU",
                      "page_size": 1,
                      "key": _require_key(),
                  },
                  timeout=REQUEST_TIMEOUT_SECONDS,
              )
              response.raise_for_status()
              data = response.json()
              items = ((data.get("result") or {}).get("items") or [])
              if not items:
                  raise ValueError(f"2GIS did not find location: {value}")
              return _point_from_item(items[0])''')
          dgis_path.write_text(dgis, encoding="utf-8")

          google_path = Path("integrations/navigation_google.py")
          google = google_path.read_text(encoding="utf-8")
          google = insert_before(google, "def _route_body(origin: str, destination: str, mode: str, departure_at: datetime) -> dict:", '''GEO_ORIGIN_RE = re.compile(r"^geo:(?P<lat>[+-]?\\d+(?:\\.\\d+)?),(?P<lon>[+-]?\\d+(?:\\.\\d+)?)$")


def _waypoint(value: str) -> dict:
              raw = str(value).strip()
              match = GEO_ORIGIN_RE.fullmatch(raw)
              if not match:
                  return {"address": _normalize_address(raw)}
              lat = float(match.group("lat"))
              lon = float(match.group("lon"))
              if not -90 <= lat <= 90 or not -180 <= lon <= 180:
                  raise ValueError("Invalid current location coordinates")
              return {"location": {"latLng": {"latitude": lat, "longitude": lon}}}


          ''')
          google = google.replace(
              '        "origin": {"address": _normalize_address(origin)},\n        "destination": {"address": _normalize_address(destination)},\n',
              '        "origin": _waypoint(origin),\n        "destination": _waypoint(destination),\n',
              1,
          )
          google_path.write_text(google, encoding="utf-8")

          web_path = Path("web_app.py")
          web = web_path.read_text(encoding="utf-8")
          web = web.replace(
              "from core.library_store import get_saved_reminder, list_saved_reminders\n",
              "from core.library_store import get_saved_reminder, list_saved_reminders\nfrom core.location_context import save_current_location\n",
              1,
          )
          web = web.replace(
              '            \'    <script src="/voice-gesture.js"></script>\\n\'\n',
              '            \'    <script src="/voice-gesture.js"></script>\\n\'\n            \'    <script src="/location.js"></script>\\n\'\n',
              1,
          )
          voice_route = '''    @app.get("/voice-gesture.js")
              def voice_gesture_js():
                  return send_from_directory(WEB_DIR, "voice_gesture.js", mimetype="application/javascript")
          '''
          if voice_route not in web:
              raise RuntimeError("voice route marker not found")
          web = web.replace(voice_route, voice_route + '''
              @app.get("/location.js")
              def location_js():
                  return send_from_directory(WEB_DIR, "location.js", mimetype="application/javascript")
          ''', 1)
          status_marker = '''    @app.get("/api/library")
              def library():
          '''
          if status_marker not in web:
              raise RuntimeError("library marker not found")
          web = web.replace(status_marker, '''    @app.post("/api/location")
              def current_location():
                  user_id = _require_user_id()
                  payload = request.get_json(silent=True) or {}
                  try:
                      location = save_current_location(
                          user_id,
                          payload.get("latitude"),
                          payload.get("longitude"),
                          payload.get("accuracy"),
                      )
                  except (TypeError, ValueError) as exc:
                      return jsonify({"error": "invalid_location", "message": str(exc)}), 400
                  return {
                      "ok": True,
                      "accuracy": location.accuracy_meters,
                      "captured_at": location.captured_at.isoformat(),
                  }

              @app.get("/api/library")
              def library():
          ''', 1)
          web_path.write_text(web, encoding="utf-8")

          Path("web/location.js").write_text('''(() => {
            "use strict";

            if (!("geolocation" in navigator)) return;

            let lastSentAt = 0;
            const minRefreshMs = 5 * 60 * 1000;

            async function sendPosition(position) {
              const now = Date.now();
              if (now - lastSentAt < minRefreshMs) return;
              lastSentAt = now;
              try {
                await fetch("/api/location", {
                  method: "POST",
                  headers: {"Content-Type": "application/json"},
                  credentials: "same-origin",
                  body: JSON.stringify({
                    latitude: position.coords.latitude,
                    longitude: position.coords.longitude,
                    accuracy: position.coords.accuracy,
                  }),
                });
              } catch (_) {
                lastSentAt = 0;
              }
            }

            function refreshLocation() {
              navigator.geolocation.getCurrentPosition(sendPosition, () => {}, {
                enableHighAccuracy: false,
                maximumAge: 5 * 60 * 1000,
                timeout: 7000,
              });
            }

            async function start() {
              if (!navigator.permissions?.query) {
                document.addEventListener("pointerdown", refreshLocation, {once: true});
                return;
              }
              try {
                const permission = await navigator.permissions.query({name: "geolocation"});
                if (permission.state === "granted") refreshLocation();
                else if (permission.state === "prompt") document.addEventListener("pointerdown", refreshLocation, {once: true});
                permission.addEventListener?.("change", () => {
                  if (permission.state === "granted") refreshLocation();
                });
              } catch (_) {}
            }

            document.addEventListener("visibilitychange", () => {
              if (document.visibilityState === "visible") refreshLocation();
            });
            start();
          })();
          ''', encoding="utf-8")

          Path("tests/test_navigation_user_behavior.py").write_text('''from datetime import datetime
          import unittest
          from unittest.mock import AsyncMock, patch

          from core.location_context import current_location_origin, save_current_location
          from integrations import navigation_2gis, navigation_ors
          from modules.calendar import _extract_title, _parse_event_timing
          from modules.navigation import _summary_destination, resolve_origin
          from modules.router import INTENT_CREATE, INTENT_UNKNOWN, _creation_text, _needs_time, _resume_pending, detect_intent


          class NaturalCalendarCommandTests(unittest.TestCase):
              def setUp(self):
                  self.now = datetime(2026, 9, 14, 12, 0)

              def test_common_activity_phrases_with_time_are_create_commands(self):
                  cases = [
                      "прогулка в ботанический сад 22:00",
                      "прогулка ботанический сад 22:00",
                      "прогулка на ВДНХ сегодня в 22",
                      "погулять по ВДНХ завтра в 19",
                      "тренировка Лужники 20:30",
                      "театр завтра в 19:00",
                      "массаж в 18:30",
                      "бассейн завтра в 7",
                      "футбол в субботу в 16",
                      "ужин дома 19:00",
                  ]
                  for text in cases:
                      with self.subTest(text=text):
                          self.assertEqual(detect_intent(text).name, INTENT_CREATE)

              def test_bare_activity_without_time_prompts(self):
                  for text in ["прогулка ботанический сад", "прогулка на ВДНХ", "погулять по ВДНХ", "тренировка Лужники", "театр Большой", "массаж"]:
                      with self.subTest(text=text):
                          self.assertEqual(detect_intent(text).name, INTENT_CREATE)
                          self.assertTrue(_needs_time(_creation_text(text)))

              def test_trailing_bare_hour_is_repaired_without_date(self):
                  self.assertEqual(_creation_text("прогулка ботанический сад 22"), "прогулка ботанический сад в 22")
                  self.assertEqual(_creation_text("тренировка Лужники 20"), "тренировка Лужники в 20")

              def test_statements_questions_weather_and_news_are_not_events(self):
                  cases = [
                      "прогулки полезны для здоровья",
