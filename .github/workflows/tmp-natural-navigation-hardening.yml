name: temporary-natural-navigation-hardening

on:
  push:
    branches:
      - codex/navigation-user-behavior-hardening-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/navigation-user-behavior-hardening-v2
          fetch-depth: 0
      - name: Apply and test
        run: |
          python scripts/tmp_prepare_hardening.py
          python scripts/tmp_harden_navigation.py
          python -m py_compile modules/router.py modules/navigation.py core/location_context.py integrations/navigation_2gis.py integrations/navigation_ors.py integrations/navigation_google.py web_app.py tests/test_navigation_user_behavior.py
          python -m unittest tests.test_navigation_user_behavior -v
          python -m unittest discover -s tests -v
          git diff --check
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modules/router.py modules/navigation.py core/location_context.py integrations/navigation_2gis.py integrations/navigation_ors.py integrations/navigation_google.py web_app.py web/location.js tests/test_navigation_user_behavior.py
          git commit -m "Harden natural calendar navigation and use live location"
          git push origin HEAD:codex/navigation-user-behavior-hardening-v2
