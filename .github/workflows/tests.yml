name: tests

on:
  push:
    branches:
      - main
      - fix/smart-planner-parser
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate deploy scripts
        run: bash -n deploy.sh scripts/deploy_update.sh
      - name: Validate web JavaScript
        run: node --check web/library.js && node --check web/reminders.js && node --check web/voice_gesture.js && node --check web/sw.js
      - name: Test voice gestures
        run: node tests/voice_gesture_test.js
      - name: Test iOS viewport pan
        run: node tests/viewport_pan_test.js
      - name: Compile Python sources
        run: python -m compileall -q bot.py web_app.py config.py core handlers integrations modules scripts tests
      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
