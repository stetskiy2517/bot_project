name: tests

on:
  push:
    branches:
      - main
      - fix/smart-planner-parser
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      WEB_PUSH_WORKER_ENABLED: "0"
      EMAIL_AUTO_WORKER_ENABLED: "0"
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate deploy scripts
        run: bash -n deploy.sh scripts/deploy_update.sh scripts/disk_maintenance.sh
      - name: Validate web JavaScript
        run: >-
          node --check web/library.js &&
          node --check web/reminders.js &&
          node --check web/reminder-editor.js &&
          node --check web/voice_gesture.js &&
          node --check web/sw.js &&
          node --check web/location.js &&
          node --check web/reliability.js &&
          node --check web/assistant.js &&
          node --check web/life-wheel.js &&
          node --check web/life-balance.js &&
          node --check web/category-manager.js &&
          node --check web/task-editor.js &&
          node --check web/tasks.js &&
          node --check web/tasks-unified.js &&
          node --check web/task-swipe.js &&
          node --check web/prebeta-polish.js &&
          node --check web/ux-polish.js &&
          node --check web/memory-controls.js &&
          node --check web/email-actions.js &&
          node --check web/navigation-extra.js &&
          node --check web/note-tools.js &&
          node --check web/yandex-auth.js &&
          node --check web/mobile-ui.js &&
          node --check web/mobile-ui-fixes.js &&
          node --check web/swipe-navigation.js &&
          node --check web/event-editor.js &&
          node --check web/file-ingest.js &&
          node --check web/admin.js &&
          node --check web/admin-metrics.js &&
          node --check web/email.js
      - name: Test voice gestures
        run: node tests/voice_gesture_test.js
      - name: Test iOS viewport pan
        run: node tests/viewport_pan_test.js
      - name: Test location client
        run: node tests/location_client_test.js
      - name: Test email connection client
        run: node tests/email_client_test.js
      - name: Compile Python sources
        run: python -m compileall -q bot.py web_app.py config.py core handlers integrations modules scripts tests
      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  browser-audit:
    uses: ./.github/workflows/browser-audit.yml
