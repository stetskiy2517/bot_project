name: tests

on:
  push:
    branches:
      - main
      - fix/smart-planner-parser
      - beta/hardening-wave5
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate deploy scripts
        run: bash -n deploy.sh scripts/deploy_update.sh
      - name: Compile Python sources
        run: python -m compileall -q bot.py web_app.py config.py core handlers integrations modules scripts tests
      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
