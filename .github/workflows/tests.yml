name: tests

on:
  push:
    branches:
      - fix/smart-planner-parser
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q bot.py config.py core handlers modules tests
      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t personal-secretary:test .
      - name: Import application inside image
        run: >-
          docker run --rm
          -e TG_TOKEN=123456:TESTTOKEN
          personal-secretary:test
          python -c "import bot; from modules.auth import create_oauth_web_app; app=create_oauth_web_app(); c=app.test_client(); r=c.get('/health'); assert r.status_code == 200; assert r.get_json() == {'status': 'ok'}; print('docker smoke ok')"
