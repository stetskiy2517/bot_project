<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Personal Secretary</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e5e7eb;background:#0b1120}*{box-sizing:border-box}body{margin:0;background:#0b1120}.app{max-width:860px;margin:auto;min-height:100vh;padding:16px}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px}.toolbar{display:flex;gap:8px}.btn,input,select{font:inherit;border:1px solid #334155;border-radius:12px;padding:11px;background:#182235;color:#fff}.primary{background:#e2e8f0;color:#0f172a}.chat{padding:24px 0 100px}.msg{max-width:82%;padding:12px;margin:8px 0;border-radius:16px;background:#182235;white-space:pre-wrap}.user{margin-left:auto;background:#2563eb}.composer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(832px,calc(100% - 28px));display:flex;gap:8px;background:#0b1120;padding:12px 0}.composer input{flex:1}.login,.panel{position:fixed;inset:0;background:rgba(11,17,32,.97);display:none;align-items:center;justify-content:center;z-index:10;padding:20px}.login.open,.panel.open{display:flex}.card{width:min(520px,100%);background:#111827;border:1px solid #334155;border-radius:18px;padding:24px}.login .card{text-align:center;max-width:420px}.muted{color:#94a3b8}.grid{display:grid;gap:14px}.field{display:grid;gap:7px}.row{display:flex;gap:8px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.days{display:flex;gap:7px;flex-wrap:wrap}.day{border:1px solid #334155;background:#0b1120;color:#cbd5e1;border-radius:10px;padding:8px 10px}.day.on{background:#2563eb;color:#fff}.notice{padding:12px;border-radius:12px;background:#172554;color:#bfdbfe;margin-bottom:14px}@media(max-width:600px){.app{padding:12px}.bar{align-items:flex-start}.toolbar{flex-wrap:wrap;justify-content:flex-end}.msg{max-width:92%}}
  </style>
</head>
<body>
  <main class="app">
    <div class="bar">
      <div><h2 style="margin:0 0 4px">Personal Secretary</h2><div id="status" class="muted">Загрузка…</div></div>
      <div class="toolbar"><button id="settingsBtn" class="btn">Настройки</button><button id="logout" class="btn">Выйти</button></div>
    </div>
    <section id="chat" class="chat"><div class="msg">Напиши поручение для календаря.</div></section>
    <form id="composer" class="composer"><input id="message" autocomplete="off" placeholder="Поставь встречу завтра в 15:00"><button class="btn primary">Отправить</button></form>
  </main>

  <div id="login" class="login"><div class="card"><h1>Personal Secretary</h1><p class="muted">Войдите через Google. Этот же аккаунт будет использоваться для вашего Google Calendar.</p><button id="googleLogin" class="btn primary">Войти через Google</button></div></div>

  <div id="settingsPanel" class="panel"><div class="card">
    <h2 style="margin-top:0">Настройки календаря</h2>
    <div id="onboardingNotice" class="notice" style="display:none">Сначала выберите часовой пояс. Он нужен, чтобы правильно создавать события.</div>
    <div class="grid">
      <label class="field">Часовой пояс
        <select id="timezone">
          <option value="Europe/Moscow">Москва — Europe/Moscow</option>
          <option value="Europe/Tallinn">Таллин — Europe/Tallinn</option>
          <option value="Europe/Helsinki">Хельсинки — Europe/Helsinki</option>
          <option value="Europe/Berlin">Берлин — Europe/Berlin</option>
          <option value="Europe/London">Лондон — Europe/London</option>
          <option value="Asia/Dubai">Дубай — Asia/Dubai</option>
          <option value="Asia/Almaty">Алматы — Asia/Almaty</option>
        </select>
      </label>
      <label class="field">Рабочий день<div class="row"><input id="workStart" type="time" value="09:00"><input id="workEnd" type="time" value="18:00"></div></label>
      <div class="field"><span>Рабочие дни</span><div id="days" class="days"></div></div>
      <label class="field">Буфер между встречами, минут<input id="buffer" type="number" min="0" max="180" value="15"></label>
    </div>
    <div class="actions"><button id="closeSettings" class="btn" type="button">Закрыть</button><button id="saveSettings" class="btn primary" type="button">Сохранить</button></div>
  </div></div>

<script>
const login=document.getElementById('login'),chat=document.getElementById('chat'),settingsPanel=document.getElementById('settingsPanel'),statusEl=document.getElementById('status');
let workDays=[0,1,2,3,4];const dayNames=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
function msg(t,w=''){const e=document.createElement('div');e.className='msg '+w;e.textContent=t;chat.appendChild(e);window.scrollTo(0,document.body.scrollHeight)}
async function api(p,o={}){const r=await fetch(p,{headers:{'Content-Type':'application/json',...(o.headers||{})},...o});if(r.status===401){login.classList.add('open');throw Error('unauthorized')}const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||d.error||'request_failed');return d}
function renderDays(){const box=document.getElementById('days');box.innerHTML='';dayNames.forEach((name,i)=>{const b=document.createElement('button');b.type='button';b.className='day '+(workDays.includes(i)?'on':'');b.textContent=name;b.onclick=()=>{workDays=workDays.includes(i)?workDays.filter(x=>x!==i):[...workDays,i].sort();renderDays()};box.appendChild(b)})}
function loadSettings(s){const p=s.preferences||{};document.getElementById('timezone').value=s.timezone||'Europe/Moscow';document.getElementById('workStart').value=p.work_start||'09:00';document.getElementById('workEnd').value=p.work_end||'18:00';document.getElementById('buffer').value=p.buffer_minutes??15;workDays=p.work_days||[0,1,2,3,4];renderDays()}
async function refresh(){try{const s=await api('/api/status');login.classList.remove('open');statusEl.textContent=(s.user.name||s.user.email)+' · Google Calendar подключён';loadSettings(s);if(!s.timezone_set){document.getElementById('onboardingNotice').style.display='block';settingsPanel.classList.add('open')}else{document.getElementById('onboardingNotice').style.display='none'}}catch(e){if(e.message!=='unauthorized')statusEl.textContent='Ошибка подключения'}}
document.getElementById('googleLogin').onclick=async()=>{try{const r=await fetch('/api/google/login');const d=await r.json();if(!r.ok)throw Error(d.message||d.error);location.href=d.url}catch(e){alert('Не удалось начать вход через Google: '+e.message)}};
document.getElementById('composer').onsubmit=async e=>{e.preventDefault();const i=document.getElementById('message'),t=i.value.trim();if(!t)return;msg(t,'user');i.value='';try{const r=await api('/api/chat',{method:'POST',body:JSON.stringify({message:t})});(r.replies||[]).forEach(x=>msg(x))}catch(e){if(e.message!=='unauthorized')msg('Ошибка: '+e.message)}};
document.getElementById('settingsBtn').onclick=()=>settingsPanel.classList.add('open');document.getElementById('closeSettings').onclick=()=>settingsPanel.classList.remove('open');
document.getElementById('saveSettings').onclick=async()=>{try{await api('/api/settings',{method:'POST',body:JSON.stringify({timezone:document.getElementById('timezone').value,work_start:document.getElementById('workStart').value,work_end:document.getElementById('workEnd').value,work_days:workDays,buffer_minutes:Number(document.getElementById('buffer').value)})});settingsPanel.classList.remove('open');msg('Настройки календаря сохранены.');await refresh()}catch(e){alert('Не удалось сохранить настройки: '+e.message)}};
document.getElementById('logout').onclick=async()=>{try{await api('/api/logout',{method:'POST'})}catch(e){}location.reload()};
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});renderDays();refresh();
</script>
</body>
</html>
