<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><title>Personal Secretary</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml"><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e5e7eb;background:#0b1120}*{box-sizing:border-box}body{margin:0;background:#0b1120}.app{max-width:860px;margin:auto;min-height:100vh;padding:16px}.bar{display:flex;justify-content:space-between;align-items:center}.btn,input{font:inherit;border:1px solid #334155;border-radius:12px;padding:11px;background:#182235;color:#fff}.primary{background:#e2e8f0;color:#0f172a}.chat{padding:24px 0 100px}.msg{max-width:82%;padding:12px;margin:8px 0;border-radius:16px;background:#182235}.user{margin-left:auto;background:#2563eb}.composer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(832px,calc(100% - 28px));display:flex;gap:8px;background:#0b1120;padding:12px 0}.composer input{flex:1}.login{position:fixed;inset:0;background:#0b1120;display:none;align-items:center;justify-content:center;z-index:10}.login.open{display:flex}.card{text-align:center;max-width:420px;padding:30px}.muted{color:#94a3b8}</style></head><body><main class="app"><div class="bar"><div><h2>Personal Secretary</h2><div id="status" class="muted">Загрузка…</div></div><button id="logout" class="btn">Выйти</button></div><section id="chat" class="chat"><div class="msg">Напиши поручение для календаря.</div></section><form id="composer" class="composer"><input id="message" placeholder="Поставь встречу завтра в 15:00"><button class="btn primary">Отправить</button></form></main><div id="login" class="login"><div class="card"><h1>Personal Secretary</h1><p class="muted">Войдите через Google. Этот же аккаунт будет использоваться для вашего Google Calendar.</p><button id="googleLogin" class="btn primary">Войти через Google</button></div></div><script>const login=document.getElementById('login'),chat=document.getElementById('chat');function msg(t,w=''){let e=document.createElement('div');e.className='msg '+w;e.textContent=t;chat.appendChild(e)}async function api(p,o={}){let r=await fetch(p,{headers:{'Content-Type':'application/json'},...o});if(r.status===401){login.classList.add('open');throw Error('unauthorized')}let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||d.error);return d}async function refresh(){try{let s=await api('/api/status');login.classList.remove('open');document.getElementById('status').textContent=(s.user.name||s.user.email)+' · Google Calendar подключён'}catch(e){}}document.getElementById('googleLogin').onclick=async()=>{try{let r=await fetch('/api/google/login');let d=await r.json();if(!r.ok)throw Error(d.message||d.error);location.href=d.url}catch(e){alert('Не удалось начать вход через Google: '+e.message)}};document.getElementById('composer').onsubmit=async e=>{e.preventDefault();let i=document.getElementById('message'),t=i.value.trim();if(!t)return;msg(t,'user');i.value='';try{let r=await api('/api/chat',{method:'POST',body:JSON.stringify({message:t})});(r.replies||[]).forEach(x=>msg(x))}catch(e){}};document.getElementById('logout').onclick=async()=>{await api('/api/logout',{method:'POST'});location.reload()};if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});refresh()</script></body></html>
