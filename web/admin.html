<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Админка · Личный секретарь</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#f5f5f7; color:#111; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:#f5f5f7; }
    button,input { font:inherit; }
    .shell { width:min(1180px,calc(100% - 32px)); margin:0 auto; padding:28px 0 48px; }
    header { display:flex; justify-content:space-between; gap:16px; align-items:center; margin-bottom:24px; }
    h1,h2 { margin:0; }
    h1 { font-size:28px; }
    h2 { font-size:18px; }
    .back { color:#111; text-decoration:none; padding:9px 12px; border:1px solid #d2d2d7; border-radius:12px; background:#fff; }
    .cards { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:20px; }
    .card,.panel { background:#fff; border:1px solid #e5e5ea; border-radius:16px; box-shadow:0 1px 2px rgba(0,0,0,.03); }
    .card { padding:16px; }
    .card small { color:#6e6e73; display:block; margin-bottom:7px; }
    .card strong { font-size:24px; }
    .panel { padding:18px; margin-bottom:18px; }
    .panel-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
    .search { width:min(360px,100%); border:1px solid #d2d2d7; border-radius:12px; padding:10px 12px; background:#fff; }
    .table-wrap { overflow:auto; }
    table { width:100%; border-collapse:collapse; min-width:760px; }
    th,td { text-align:left; padding:11px 10px; border-bottom:1px solid #eee; vertical-align:middle; }
    th { font-size:12px; color:#6e6e73; font-weight:600; }
    td { font-size:14px; }
    tr:last-child td { border-bottom:0; }
    .muted { color:#6e6e73; }
    .pill { display:inline-flex; align-items:center; border-radius:999px; padding:4px 8px; font-size:12px; background:#f2f2f7; }
    .pill.on { background:#e8f7ec; color:#176b2c; }
    .pill.off { background:#f8ecec; color:#8a2525; }
    .toggle { border:0; border-radius:10px; padding:8px 10px; cursor:pointer; background:#111; color:#fff; min-width:92px; }
    .toggle.secondary { background:#eee; color:#111; }
    .toggle:disabled { opacity:.45; cursor:default; }
    .status { min-height:20px; margin:8px 0 0; color:#6e6e73; font-size:13px; }
    .error { color:#a00; }
    @media (max-width:760px) {
      .shell { width:min(100% - 20px,1180px); padding-top:18px; }
      .cards { grid-template-columns:repeat(2,minmax(0,1fr)); }
      header { align-items:flex-start; }
      .panel-head { align-items:flex-start; flex-direction:column; }
      .search { width:100%; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>Админка</h1>
        <div class="muted">Пользователи и доступ к платным функциям</div>
      </div>
      <a class="back" href="/">В приложение</a>
    </header>

    <section class="cards" aria-label="Сводка">
      <div class="card"><small>Пользователей</small><strong id="totalUsers">—</strong></div>
      <div class="card"><small>Ручных AI-настроек</small><strong id="managedAi">—</strong></div>
      <div class="card"><small>Режим AI</small><strong id="aiMode">—</strong></div>
      <div class="card"><small>Действий админа</small><strong id="auditCount">—</strong></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div>
          <h2>Пользователи</h2>
          <div class="status" id="userStatus"></div>
        </div>
        <input id="userSearch" class="search" type="search" autocomplete="off" placeholder="Имя или email">
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>ID</th><th>Пользователь</th><th>Регистрация</th><th>Роль</th><th>AI</th><th>Управление</th></tr></thead>
          <tbody id="usersBody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>Журнал действий</h2></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Когда</th><th>Админ</th><th>Действие</th><th>Пользователь</th><th>Детали</th></tr></thead>
          <tbody id="auditBody"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/admin.js" defer></script>
  <script src="/admin-metrics.js" defer></script>
</body>
</html>
